name: Validate LIA website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check pages, links, and publishing configuration
        run: python3 scripts/validate.py
      - name: Check JavaScript syntax
        run: node --check website/assets/site.js
