[build]
  publish = "website"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/request-info/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://logos-international-academy.alanlu439.chatgpt.site"
    Vary = "Origin"
